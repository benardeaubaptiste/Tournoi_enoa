# Déploiement automatique sur le VPS à chaque push/merge sur main :
# envoi des fichiers par rsync puis reconstruction de l'image Docker sur le VPS.
# Le .env et le docker-compose.yml du VPS ne sont jamais écrasés.
# Secrets requis : VPS_HOST, VPS_USER, VPS_SSH_KEY
name: Déploiement

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Préparer la clé SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Envoyer les fichiers
        run: |
          rsync -az --delete \
            --exclude '.git' --exclude '.github' --exclude '.env' \
            --exclude 'docker-compose.yml' --exclude 'vendor' --exclude 'tests' \
            ./ ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/tournoi_enoa/

      - name: Reconstruire et relancer
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "cd /opt/tournoi_enoa && docker compose up -d --build web && docker image prune -f"
